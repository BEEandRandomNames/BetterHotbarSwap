plugins {
    id "fabric-loom" version "1.7-SNAPSHOT"
    id "maven-publish"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

def modMenuJarCandidates = [
    file("libs/modmenu-7.2.2.jar"),
    file("libs/modmenu.jar"),
    file("modmenu-7.2.2.jar"),
    file("modmenu.jar"),
    file("C:/Users/bemre/AppData/Roaming/PrismLauncher/instances/1.20.1/minecraft/mods/modmenu-7.2.2.jar")
]
def localModMenuJar = modMenuJarCandidates.find { it.exists() }

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    if (localModMenuJar != null) {
        modCompileOnly files(localModMenuJar)
    }
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    filesMatching("fabric.mod.json") {
        expand "version": project.version, "minecraft_version": project.minecraft_version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = 17
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}